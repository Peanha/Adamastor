name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CLANG_FORMAT_VERSION: "22.1.8"
  CLANG_TIDY_VERSION: "22.1.7"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx install clang-format==${{ env.CLANG_FORMAT_VERSION }}
      - run: clang-format --version
      - run: make fmt-check

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx install clang-tidy==${{ env.CLANG_TIDY_VERSION }}
      - run: clang-tidy --version
      - run: make tidy
